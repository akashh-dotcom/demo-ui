version: "3.9"

# =============================================================================
# Manuscript Processor - Docker Compose Configuration
# =============================================================================
# Supports two modes:
#   1. Development (default): Uses local MongoDB container + mock APIs
#   2. Production: Uses external MongoDB (Atlas/DocumentDB) + real APIs
# =============================================================================

services:
  # ===========================================================================
  # MongoDB (Development Only)
  # ===========================================================================
  # Comment out or remove this service when using external MongoDB
  mongodb:
    image: mongo:6.0
    container_name: manuscript-mongodb
    restart: unless-stopped
    profiles:
      - dev
      - default
    environment:
      MONGO_INITDB_DATABASE: manuscript-processor
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Backend API
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: manuscript-backend
    restart: unless-stopped
    environment:
      # MongoDB: Use external if MONGODB_URI is set, otherwise use local container
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/RittenhouseXMLConverter}
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
      # Frontend URL for CORS
      FRONTEND_URL: http://${HOST_IP:-localhost}:3000
      # External API configuration
      USE_EXTERNAL_APIS: ${USE_EXTERNAL_APIS:-true}
      PDF_API_URL: ${PDF_API_URL:-http://pdf-api:8000}
      EPUB_API_URL: ${EPUB_API_URL:-http://epub-api:5001}
      EPUB_EDITOR_URL: ${EPUB_EDITOR_URL:-http://epub-api:5000}
    depends_on:
      mongodb:
        condition: service_healthy
        required: false
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/usr/src/app/uploads
      - ./backend/outputs:/usr/src/app/outputs

  # ===========================================================================
  # Frontend (React/Vite)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://${HOST_IP:-localhost}:5000/api
    container_name: manuscript-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://${HOST_IP:-localhost}:5000/api
    depends_on:
      - backend
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]

  # ===========================================================================
  # PDF Processing API (Mock for Development)
  # ===========================================================================
  # In production, set PDF_API_URL to your actual PDF service
  pdf-api:
    build:
      context: ./mocks/pdf-api
    container_name: manuscript-pdf-api
    restart: unless-stopped
    profiles:
      - dev
      - default
    environment:
      PORT: 8000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/RittenhouseXMLConverter}
    ports:
      - "8000:8000"

  # ===========================================================================
  # EPUB Processing API (Mock for Development)
  # ===========================================================================
  # In production, set EPUB_API_URL to your actual EPUB service
  epub-api:
    build:
      context: ./mocks/epub-api
    container_name: manuscript-epub-api
    restart: unless-stopped
    profiles:
      - dev
      - default
    environment:
      PORT: 5001
      EDITOR_PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/RittenhouseXMLConverter}
    ports:
      - "5001:5001"

volumes:
  mongodb-data:

# =============================================================================
# USAGE INSTRUCTIONS
# =============================================================================
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ DEVELOPMENT (Local MongoDB + Mock APIs)                                  │
# ├─────────────────────────────────────────────────────────────────────────┤
# │                                                                          │
# │   docker-compose up --build                                              │
# │                                                                          │
# │   This starts: MongoDB, Backend, Frontend, PDF Mock, EPUB Mock           │
# │   Access: http://localhost:3000                                          │
# │                                                                          │
# └─────────────────────────────────────────────────────────────────────────┘
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ PRODUCTION (External MongoDB + Real APIs)                                │
# ├─────────────────────────────────────────────────────────────────────────┤
# │                                                                          │
# │   # Create .env file or export variables:                                │
# │   export MONGODB_URI="mongodb+srv://user:pass@cluster.mongodb.net/db"    │
# │   export PDF_API_URL="https://pdf-api.yourcompany.com"                   │
# │   export EPUB_API_URL="https://epub-api.yourcompany.com"                 │
# │   export HOST_IP="your-server-ip-or-domain"                              │
# │                                                                          │
# │   # Run without dev services (no local mongo, no mocks):                 │
# │   docker-compose --profile prod up --build                               │
# │                                                                          │
# │   # Or just backend + frontend (APIs are external):                      │
# │   docker-compose up backend frontend --build                             │
# │                                                                          │
# └─────────────────────────────────────────────────────────────────────────┘
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ SHARED MONGODB (All services use same external DB)                       │
# ├─────────────────────────────────────────────────────────────────────────┤
# │                                                                          │
# │   All services (demo-ui, pdf-api, epub-api) should use the same          │
# │   MONGODB_URI connection string:                                         │
# │                                                                          │
# │   MONGODB_URI=mongodb+srv://user:pass@cluster.mongodb.net/manuscript     │
# │                                                                          │
# │   This allows:                                                           │
# │   - Shared user authentication                                           │
# │   - Shared job tracking                                                  │
# │   - Shared configuration                                                 │
# │   - Cross-service data access                                            │
# │                                                                          │
# └─────────────────────────────────────────────────────────────────────────┘
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ ENVIRONMENT VARIABLES                                                    │
# ├─────────────────────────────────────────────────────────────────────────┤
# │                                                                          │
# │   MONGODB_URI      - MongoDB connection string (Atlas/DocumentDB/local)  │
# │   HOST_IP          - Server IP or domain (default: localhost)            │
# │   NODE_ENV         - development | production                            │
# │   USE_EXTERNAL_APIS- true | false                                        │
# │   PDF_API_URL      - URL to PDF processing service                       │
# │   EPUB_API_URL     - URL to EPUB processing service                      │
# │   EPUB_EDITOR_URL  - URL to EPUB editor service                          │
# │                                                                          │
# └─────────────────────────────────────────────────────────────────────────┘
