name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    types: [synchronize, opened, reopened, closed]
    branches: [main]

permissions:
  id-token: write
  contents: read

# Cancel active previous workflows in the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
# ============================================================================
# Lint & Type Check
# ============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-requests

      - name: Run Ruff linter
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Run Ruff formatter check
        run: ruff format --check .
        continue-on-error: true

##################################################################
# Build, Scan and Push Docker images to ECR
##################################################################
  build-scan-push-frontend:
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name == 'pull_request'
  
    env:
      IMAGE_TAG: ${{ github.sha }}
      AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-oidc
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION \
          | docker login --username AWS --password-stdin \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
  
      - name: Set short image tag
        run: |
          echo "TAG=${IMAGE_TAG::7}" >> $GITHUB_ENV
          echo "IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/manuscript/frontend:${IMAGE_TAG::7}" >> $GITHUB_ENV
  
      - name: Build Frontend Docker image
        run: |
          docker build -t frontend:$TAG ./frontend
          docker tag frontend:$TAG $IMAGE_URI
  
      - name: Trivy scan - Frontend image
        uses: aquasecurity/trivy-action@0.22.0
        with:
          image-ref: ${{ env.IMAGE_URI }}
          severity: HIGH,CRITICAL
          format: table
          exit-code: 0       
          ignore-unfixed: true
  
      - name: Push Frontend image to ECR
        run: |
          docker push $IMAGE_URI

################# Backend Image Workflow ##########################
  build-scan-push-backend:
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name == 'pull_request'
  
    env:
      IMAGE_TAG: ${{ github.sha }}
      AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
  
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-oidc
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
  
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION \
          | docker login --username AWS --password-stdin \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
  
      - name: Set short image tag
        run: |
          echo "TAG=${IMAGE_TAG::7}" >> $GITHUB_ENV
          echo "IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/manuscript/backend:${IMAGE_TAG::7}" >> $GITHUB_ENV
  
      - name: Build Backend Docker image
        run: |
          docker build -t backend:$TAG ./backend
          docker tag backend:$TAG $IMAGE_URI
  
      - name: Trivy scan - Backend image
        uses: aquasecurity/trivy-action@0.22.0
        with:
          image-ref: ${{ env.IMAGE_URI }}
          severity: HIGH,CRITICAL
          format: table
          exit-code: 0      
          ignore-unfixed: true
  
      - name: Push Backend image to ECR
        run: |
          docker push $IMAGE_URI

##################################################
 # Update docker-compose repo with new image tags 
##################################################    
  update-tags:
    runs-on: ubuntu-latest
    needs: [lint,build-scan-push-frontend,build-scan-push-backend]
    if: github.event.pull_request.merged == true

    env:
      IMAGE_TAG: ${{ github.sha }}
      AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

    steps:
      - name: Checkout manuscript-apps repo
        run: |
          git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/akashh-dotcom/manuscript-apps.git
          cd manuscript-apps

      - name: Update docker-compose image tags
        run: |
          set -e
          TAG=$(echo $IMAGE_TAG | cut -c1-7)

          cd manuscript-apps
          # Update backend image
          echo "✅ Updating backend image tag to $TAG"
            sed -i \
              "s|\${image}/backend:.*|\${image}/backend:$TAG|g" \
              docker-compose.yaml
            
            sed -i \
              "s|\${image}/frontend:.*|\${image}/frontend:$TAG|g" \
              docker-compose.yaml


          git status

      - name: Commit and push changes
        run: |
          cd manuscript-apps

          if git diff --quiet; then
            echo "⏭️ No changes to commit"
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "Update docker image tags of frontend & Backend  ${{ github.sha }}"
          git push origin main
        
# ============================================================================
# CD will start from here after PR is merged
# ============================================================================

  deploy-via-ssm:
   name: Deploy to EC2 via SSM run command
   if: github.event.pull_request.merged == true
   runs-on: ubuntu-latest
   needs: [update-tags]
 
   permissions:
     id-token: write
     contents: read
 
   env:
     AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
     AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
     INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
 
   steps:
     - name: Checkout repo
       uses: actions/checkout@v4
 
     - name: Configure AWS credentials via OIDC
       uses: aws-actions/configure-aws-credentials@v4
       with:
         role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-oidc
         aws-region: ${{ env.AWS_REGION }}
 
     - name: Deploy using SSM Run Command
       run: |
         aws ssm send-command \
           --instance-ids ${{ env.INSTANCE_ID }} \
           --document-name "AWS-RunShellScript" \
           --comment "Deploy manuscript apps via GitHub Actions" \
           --parameters 'commands=[
             "set -e",
             "cd /home/ubuntu || exit 1",
             "export HOME=/root",
             "git config --global --add safe.directory /home/ubuntu/manuscript-apps",
             "if [ ! -d manuscript-apps ]; then git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/akashh-dotcom/manuscript-apps.git; else cd manuscript-apps && git pull origin main; fi",
             "cd /home/ubuntu/manuscript-apps",
             "chmod 644 export-secrets.sh",
             ". ./export-secrets.sh",
             "aws ecr get-login-password --region '"$AWS_REGION"' | docker login --username AWS --password-stdin '"$AWS_ACCOUNT_ID"'.dkr.ecr.'"$AWS_REGION"'.amazonaws.com",
             "docker-compose pull",
             "docker-compose down",
             "docker-compose up -d --build",
             "docker image prune -a -f",
             "docker exec ritt-frontend npm run build",
             "rm -rf /var/www/html/*",
             "docker cp ritt-frontend:/usr/src/app/dist/. /var/www/html/"
           ]'
 